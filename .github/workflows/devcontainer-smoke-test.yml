name: Devcontainer smoke test

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Devcontainer smoke test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    name: Devcontainer smoke test

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false

    steps:
    - name: Checkout (GitHub)
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Login to GitHub Container Registry
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772   # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ruby
        bundler-cache: true

    - name: Generate rails app sqlite3
      run: bundle exec railties/exe/rails new myapp_sqlite --database="sqlite3" --dev --devcontainer

    - name: Test devcontainer sqlite3
      uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6   # v0.3.1900000417
      with:
        subFolder: myapp_sqlite
        imageName: ghcr.io/rails/smoke-test-devcontainer
        cacheFrom: ghcr.io/rails/smoke-test-devcontainer
        imageTag: sqlite3
        push: ${{ github.repository == 'rails/rails' && 'filter' || 'never' }}
        refFilterForPush: refs/heads/main
        runCmd: bin/rails g scaffold Post && bin/rails db:migrate && bin/rails test

    - name: Stop all containers
      run: docker ps -q | xargs docker stop

    - name: Generate rails app postgresql
      run: bundle exec railties/exe/rails new myapp_postgresql --database="postgresql" --dev --devcontainer

    - name: Test devcontainer postgresql
      uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6   # v0.3.1900000417
      with:
        subFolder: myapp_postgresql
        imageName: ghcr.io/rails/smoke-test-devcontainer
        cacheFrom: ghcr.io/rails/smoke-test-devcontainer
        imageTag: postgresql
        push: ${{ github.repository == 'rails/rails' && 'filter' || 'never' }}
        refFilterForPush: refs/heads/main
        runCmd: bin/rails g scaffold Post && bin/rails db:migrate && bin/rails test && bin/rails test:system

    - name: Stop all containers
      run: docker ps -q | xargs docker stop

    - name: Generate rails app mysql
      run: bundle exec railties/exe/rails new myapp_mysql --database="mysql" --dev --devcontainer

    - name: Test devcontainer mysql
      uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6   # v0.3.1900000417
      with:
        subFolder: myapp_mysql
        imageName: ghcr.io/rails/smoke-test-devcontainer
        cacheFrom: ghcr.io/rails/smoke-test-devcontainer
        imageTag: mysql
        push: ${{ github.repository == 'rails/rails' && 'filter' || 'never' }}
        refFilterForPush: refs/heads/main
        runCmd: bin/rails g scaffold Post && bin/rails db:migrate && bin/rails test

    - name: Stop all containers
      run: docker ps -q | xargs docker stop

    - name: Generate rails app trilogy
      run: bundle exec railties/exe/rails new myapp_trilogy --database="trilogy" --dev --devcontainer

    - name: Test devcontainer trilogy
      uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6   # v0.3.1900000417
      with:
        subFolder: myapp_trilogy
        imageName: ghcr.io/rails/smoke-test-devcontainer
        cacheFrom: ghcr.io/rails/smoke-test-devcontainer
        imageTag: trilogy
        push: ${{ github.repository == 'rails/rails' && 'filter' || 'never' }}
        refFilterForPush: refs/heads/main
        runCmd: bin/rails g scaffold Post && bin/rails db:migrate && bin/rails test

    - name: Stop all containers
      run: docker ps -q | xargs docker stop
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
